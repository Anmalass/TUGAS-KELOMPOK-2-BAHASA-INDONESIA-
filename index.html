<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presentasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Loading state, shown until content.json is fetched -->
  <div id="loading-screen">
    <p>Memuat presentasi&hellip;</p>
  </div>

  <!-- Error state, shown if content.json fails to load -->
  <div id="error-screen" hidden>
    <p>Presentasi tidak dapat dimuat.</p>
    <p class="error-detail">Pastikan file <code>content/content.json</code> tersedia dan formatnya valid, lalu muat ulang halaman.</p>
  </div>

  <main id="app" hidden>

    <!-- Vertical tab rail — populated with one tab per slide -->
    <nav id="slide-rail" aria-label="Navigasi slide"></nav>

    <!-- Slides are injected here, one <section class="slide"> per slide -->
    <div id="slide-viewport"></div>

    <!-- Bottom controls -->
    <footer id="controls">
      <button id="btn-prev" class="nav-btn" aria-label="Slide sebelumnya" type="button">&#8592;</button>
      <div id="progress" aria-live="polite"></div>
      <button id="btn-next" class="nav-btn" aria-label="Slide berikutnya" type="button">&#8594;</button>
    </footer>

  </main>

  <script src="js/app.js" defer></script>
</body>
</html>
