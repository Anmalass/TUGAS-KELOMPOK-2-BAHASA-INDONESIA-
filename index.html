<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6f2">
  <title>Presentasi Teks Prosedur</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="loading-screen">Memuat presentasi…</div>
  <div id="error-screen" hidden>
    <h1>Presentasi tidak dapat dimuat</h1>
    <p>Pastikan folder <code>content</code> dan file <code>content.json</code> tetap berada di dalam folder project.</p>
    <p id="error-technical"></p>
  </div>

  <main id="app" hidden>
    <header class="topbar">
      <span class="brand">KELOMPOK 2</span>
      <span id="progress"></span>
    </header>
    <div id="slide-viewport"></div>
    <nav id="slide-rail" aria-label="Navigasi presentasi"></nav>
    <div class="controls" aria-label="Kontrol presentasi">
      <button id="btn-prev" type="button" aria-label="Bagian sebelumnya">↑</button>
      <button id="btn-next" type="button" aria-label="Bagian berikutnya">↓</button>
    </div>
  </main>

  <script src="js/app.js" defer></script>
</body>
</html>
